<style>
/* Layout: kanvas desain tetap 1893x831 (sama dengan referensi), tiap panel diposisikan absolut lalu seluruh kanvas diskalakan agar muat lebar layar. */
:root{
  --bg:#0a1a40;
  --navy-hi:#1c4299;
  --navy-lo:#0a1f4d;
  --edge:#5aa2ff;

  --gold-lo:#b8780f;
  --green-hi:#58ea42;
  --green-lo:#0d981b;
  --red:#ff3d3d;
  --violet-hi:#8a55ff;
  --violet-lo:#4620b4;
  --ink:#ffffff;
  --f-display:'Lilita One','Nunito',system-ui,sans-serif;
  --f-ui:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{
  margin:0;color:var(--ink);font-family:var(--f-ui);
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));

}

#stage{
  position:absolute;left:0;top:0;width:1893px;height:831px;transform-origin:0 0;overflow:hidden;
  background:
    radial-gradient(ellipse 520px 620px at 946px 380px,rgba(160,225,255,.55),rgba(160,225,255,0) 70%),

  user-select:none;-webkit-user-select:none;
}
.abs{position:absolute}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:inherit}

svg{display:block}
.ico{width:100%;height:100%}

/* teks umum */
.t{font-family:var(--f-ui);font-weight:800;color:#fff;-webkit-text-stroke:4px #0b1c5c;paint-order:stroke fill;text-shadow:0 3px 0 rgba(4,14,58,.55);white-space:nowrap;letter-spacing:.1px;font-synthesis:none}

.panel{

  background:linear-gradient(180deg,var(--navy-hi) 0%,#12306f 45%,var(--navy-lo) 100%);
  box-shadow:0 0 0 3px #0a1a45,0 0 0 5px var(--edge),inset 0 2px 0 rgba(170,210,255,.5),inset 0 -12px 24px rgba(0,10,50,.55),0 12px 24px rgba(0,8,40,.45);

.cur{

.dot.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.dot[hidden]{display:none!important}

/* ===== menu kiri ===== */
#side{left:56px;top:178px;width:276px;height:410px;border-radius:28px 46px 34px 28px;padding:15px 14px}

#event{
  position:absolute;left:1409px;top:178px;width:428px;height:129px;border-radius:28px 40px 28px 28px;overflow:hidden;cursor:pointer;text-align:left;
  background:
    radial-gradient(circle at 18% 60%,rgba(190,140,255,.75),transparent 55%),
    linear-gradient(100deg,#4b34cf 0%,#7a45ec 55%,#4a2bb0 100%);
  box-shadow:0 0 0 3px #1a1670,0 0 0 5px #8fb6ff,inset 0 2px 0 rgba(255,255,255,.45),inset 0 -10px 20px rgba(20,10,90,.45),0 10px 20px rgba(0,8,40,.4);
  transition:transform .15s ease,filter .15s ease;

   bingkai gradien 2px dengan berkas cahaya cyan yang berputar
   ===================================================================== */
.uvc{background:none!important;
  --c-base:hsl(222,62%,15%);--c-g1:hsl(212,95%,34%);--c-g2:hsl(200,95%,40%);--c-g3:hsl(222,90%,16%);--c-beam:hsl(189,100%,50%);--bh:100px}

<script>
(function(){
  var wrap=document.getElementById('wrap'),stage=document.getElementById('stage');
  function fit(){
    var w=wrap.clientWidth,vh=window.innerHeight||0,vw=window.innerWidth||w;
    var portrait=vw<760&&vh>vw*1.15;
    if(portrait){
      var s=Math.min(w/831,(vh-48)/1893);
      stage.style.transform='translate('+((w+831*s)/2).toFixed(1)+'px,0) rotate(90deg) scale('+s+')';
      wrap.style.height=(1893*s)+'px';
    }else{
      var k=w/1893;stage.style.transform='scale('+k+')';wrap.style.height=(831*k)+'px';
    }
  }
  fit();
  if(window.ResizeObserver){new ResizeObserver(fit).observe(wrap)}
  addEventListener('resize',fit);addEventListener('orientationchange',fit);

  /* lapisan card (curly-moth-56) */
  document.querySelectorAll('.uvc').forEach(function(c){c.insertAdjacentHTML('afterbegin','<i class="uv-bg"><i class="uv-in"></i></i>')});

  /* karangan daun emas */
  function wreath(cx,cy,rx,ry,a0,a1,n,L,W){
    var s='';
    for(var i=0;i<n;i++){
      var t=i/(n-1),th=(a0+(a1-a0)*t)*Math.PI/180;
      var x=cx+rx*Math.cos(th),y=cy+ry*Math.sin(th);
      var head=th*180/Math.PI+(a1>a0?90:-90);
      var k=0.7+0.5*Math.sin(Math.PI*(0.12+0.76*t));
      [-40,40].forEach(function(off){
        s+='<g transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+') rotate('+(head+off).toFixed(1)+') scale('+k.toFixed(2)+')"><path class="lf lf'+((i+(off>0?1:0))%3+1)+'" d="M0 0Q'+(L/2)+' '+(-W)+' '+L+' 0Q'+(L/2)+' '+W+' 0 0Z"/></g>';
      });
    }
    return '<g fill="url(#g-gold)" stroke="#8a520a" stroke-width=".9" stroke-linejoin="round">'+s+'</g>';
  }

  /* toast */
  var toast=document.getElementById('toast'),tt;
  function say(m){toast.textContent=m;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove('show')},1400)}

  /* menu kiri */
  var side=[].slice.call(document.querySelectorAll('[data-side]'));
  side.forEach(function(b){b.addEventListener('click',function(){
    side.forEach(function(x){x.classList.remove('active')});b.classList.add('active');
    var d=b.querySelector('.dot');if(d)d.hidden=true;
  })});

  /* navigasi bawah */
  var tabs=[].slice.call(document.querySelectorAll('.tab')),baru=document.getElementById('baru');
  tabs.forEach(function(b){b.addEventListener('click',function(){
    tabs.forEach(function(x){x.classList.remove('active')});b.classList.add('active');
    if(b.dataset.tab==='Toko')baru.hidden=true;
    say(b.dataset.tab);
  })});

  /* titik merah & lencana */
  var mailBadge=document.getElementById('mail-badge');
  document.addEventListener('click',function(e){
    var host=e.target.closest('button');if(!host)return;
    var d=host.querySelector('[data-clear]');if(d)d.hidden=true;
    if(host.contains(mailBadge))mailBadge.hidden=true;
  });
  document.querySelectorAll('[data-toast]').forEach(function(b){b.addEventListener('click',function(){say(b.dataset.toast)})});

  /* penambah mata uang */
  var vals={gems:20,coins:420};
  function countTo(id,to){
    var el=document.getElementById(id),from=vals[id],t0=performance.now(),dur=420;
    (function step(t){var p=Math.min(1,(t-t0)/dur);el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step)})(t0);
    vals[id]=to;
  }
  document.querySelectorAll('.plus').forEach(function(b){b.addEventListener('click',function(){
    var id=b.dataset.add,amt=+b.dataset.amt;countTo(id,vals[id]+amt);
    var f=document.createElement('span');f.className='float-n';f.textContent='+'+amt;
    f.style.left=(b.offsetLeft+6)+'px';f.style.top=(b.offsetTop-30)+'px';
    b.parentElement.appendChild(f);setTimeout(function(){f.remove()},900);
  })});

  /* carousel event */
  var slides=[].slice.call(document.querySelectorAll('.slide')),dots=[].slice.call(document.querySelectorAll('#ev-dots button')),cur=0,auto;
  function show(i){cur=(i+slides.length)%slides.length;slides.forEach(function(s,k){s.classList.toggle('on',k===cur)});dots.forEach(function(d,k){d.classList.toggle('on',k===cur)})}
  function restart(){clearInterval(auto);auto=setInterval(function(){show(cur+1)},5000)}
  dots.forEach(function(d,k){d.addEventListener('click',function(){show(k);restart()})});
  document.getElementById('event').addEventListener('click',function(){show(cur+1);restart()});
  restart();

  var goBtn=document.getElementById('go');goBtn.addEventListener('click',function(){say('Pilih mode permainan');goBtn.classList.add('on');setTimeout(function(){goBtn.classList.remove('on')},1600)});
})();
</script>

</body></html>
