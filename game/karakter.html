<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/page.css">
<title>Dragon Roll — Karakter</title>
<link rel="stylesheet" href="css/karakter.css">
<link rel="stylesheet" href="css/bg.css">
</head>
<body class="kr">
<div id="wrap"><div id="stage">
  <!-- tata letak mengikuti layar Equipment (assets/penerapan/fcuBiA.png) -->
  <button id="back" aria-label="Kembali"><img src="assets/komponen/ikon-navigasi/panah-kembali.webp" alt=""></button>
  <div id="title" class="ttl">Karakter</div>
  <div class="cur" id="cur-em"><img src="assets/komponen/ikon-gem-medali/berlian-hijau.webp" alt=""><div class="v" id="v-em">—</div><div class="plus">+</div></div>
  <div class="cur" id="cur-co"><img src="assets/komponen/hud/ikon-koin-emas.webp" alt=""><div class="v" id="v-co">—</div><div class="plus">+</div></div>
  <button id="home" aria-label="Lobby"><img src="assets/komponen/ikon-navigasi/ikon-home.webp" alt=""></button>

  <!-- kiri: slot samping + hero di pedestal + nama + level + statistik -->
  <section id="left">
    <div class="eqs" id="eqL"></div>
    <div id="art"></div>
    <div class="eqs" id="eqR"></div>
    <div id="nm" class="ttl"></div>
    <div id="lv"><b class="ttl" id="lvn">1</b><div class="lvr"><span class="l">Level</span><span class="p" id="lvp"></span><i><u id="lvf"></u></i></div></div>
    <div id="sep"></div>
    <div id="stats"></div>
    <div id="info"><div id="cls"></div><p id="ds"></p></div>
  </section>

  <!-- kanan: tab kategori + grid slot hero + tombol aksi -->
  <section id="right">
    <div id="tabs"></div>
    <div id="grid"></div>
    <button class="btn" id="use"><img src="assets/komponen/tombol-dan-kontrol/tombol-hijau-polos.webp" alt=""><span>GUNAKAN</span></button>
  </section>

  <div id="toast"></div><div id="fade"></div>
</div></div>
<script src="js/heroes.js"></script>
<script src="js/karakter.js"></script>
</body></html>
