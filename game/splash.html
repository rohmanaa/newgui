<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dragon Roll</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/page.css">
<link rel="stylesheet" href="css/splash.css">
</head>
<body class="sub">
<div id="wrap"><div id="stage">
  <img id="logo" src="assets/komponen/logo/logo-fantasy-rpg.webp" alt="Dragon Roll">
  <div id="loadbox"><div id="bar"><i id="fill"></i></div><div id="lbl" class="ttl">Memuat game… 0%</div></div>
  <button class="btn" id="loginbtn" hidden><img src="assets/komponen/tombol-dan-kontrol/tombol-hijau-polos.webp" alt=""><span>LOGIN</span></button>
  <div id="authmodal"><div class="box panel">
    <div class="seg" id="tabs"><button id="tabup" class="on">DAFTAR</button><button id="tabin">MASUK</button></div>
    <input id="user" class="field" maxlength="16" placeholder="Username (3–16: huruf, angka, _)" autocomplete="off">
    <input id="pass" class="field" type="password" placeholder="Password (min. 6 karakter)">
    <div id="err"></div>
    <div class="row"><button class="btn" id="cancel"><img src="assets/komponen/tombol-dan-kontrol/tombol-merah-polos.webp" alt=""><span>BATAL</span></button><button class="btn" id="ok"><img src="assets/komponen/tombol-dan-kontrol/tombol-hijau-polos.webp" alt=""><span>OK</span></button></div>
  </div></div>
  <div id="fade"></div>
</div></div>
<script src="js/splash.js"></script>
</body></html>
