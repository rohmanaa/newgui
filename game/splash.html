<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dragon Roll</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/splash.css">
</head>
<body class="splash">
<div id="wrap"><div id="stage">
  <!-- latar gua + hero + spinner (mengikuti m726N1) -->
  <div id="cave"><i id="beam"></i><i id="floor"></i></div>
  <img id="hero" src="assets/komponen/karakter-monster/hero-shuri-pemanah.webp" alt="">
  <img id="spin" src="assets/komponen/hud/efek-titik-berputar.webp" alt="">
  <div id="vig"></div>

  <div id="loadbox">
    <img class="frm" src="assets/komponen/logo/bar-loading-bingkai-kosong.webp" alt="">
    <div id="bar"><i id="fill"></i></div>
    <div id="lbl">Loading… 0%</div>
  </div>
  <button class="btn" id="loginbtn" hidden><img src="assets/komponen/tombol-dan-kontrol/tombol-biru-polos.webp" alt=""><span>Login</span></button>

  <!-- LOGIN -->
  <div class="amodal" id="m-login"><div class="dlg">
    <div class="dh"><span>Login</span><button class="x" data-close aria-label="Tutup"><img src="assets/komponen/glyph-putih/silang.webp" alt=""></button></div>
    <div class="df">
      <label class="inp"><img src="assets/komponen/glyph-putih/pengguna.webp" alt=""><input id="li-id" maxlength="64" placeholder="Username atau email" autocomplete="username"></label>
      <label class="inp"><img src="assets/komponen/glyph-putih/gembok.webp" alt=""><input id="li-pw" type="password" placeholder="Password" autocomplete="current-password"></label>
      <label class="rem"><input id="li-rem" type="checkbox" checked><span class="cb"></span>Remember me</label>
      <div class="err" id="li-err"></div>
      <button class="btn blue" id="li-ok"><img src="assets/komponen/tombol-dan-kontrol/tombol-biru-polos.webp" alt=""><span>Login</span></button>
      <div class="foot"><a id="to-signup" href="#">SIGN UP</a><a id="forgot" href="#" class="dim">Lupa password?</a></div>
    </div>
  </div></div>

  <!-- SIGN UP -->
  <div class="amodal" id="m-signup"><div class="dlg">
    <div class="dh"><span>Sign up</span><button class="x" data-close aria-label="Tutup"><img src="assets/komponen/glyph-putih/silang.webp" alt=""></button></div>
    <div class="df">
      <label class="inp"><img src="assets/komponen/glyph-putih/surat.webp" alt=""><input id="su-em" type="email" maxlength="80" placeholder="Email" autocomplete="email"></label>
      <label class="inp"><img src="assets/komponen/glyph-putih/pengguna.webp" alt=""><input id="su-us" maxlength="16" placeholder="Username (3–16: huruf, angka, _)" autocomplete="username"></label>
      <label class="inp"><img src="assets/komponen/glyph-putih/gembok.webp" alt=""><input id="su-pw" type="password" placeholder="Password (min. 6 karakter)" autocomplete="new-password"></label>
      <div class="err" id="su-err"></div>
      <button class="btn blue" id="su-ok"><img src="assets/komponen/tombol-dan-kontrol/tombol-biru-polos.webp" alt=""><span>Sign up</span></button>
      <div class="foot c">Sudah punya akun? <a id="to-login" href="#">Log in</a></div>
    </div>
  </div></div>
</div></div>
<div id="fade"></div>
<script src="js/splash.js"></script>
</body></html>
