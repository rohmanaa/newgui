<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dragon Roll — Gameplay</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/gameplay.css">
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="boardwrap"><div id="board"></div><svg id="links"></svg><div id="tokens"></div></div>
  <div id="side">
    <div id="players"></div>
    <div id="turnbox"><div id="turnname" class="t-title">—</div><div id="dice"><b id="dnum">?</b></div><div id="events"></div></div>
    <div id="btns">
      <button id="roll" class="gbtn green t-title">ROLL</button>
      <button id="auto" class="gbtn blue t-title">AUTO: OFF</button>
    </div>
    <div id="log"></div>
  </div>
  <button id="pausebtn" class="round t-title">II</button>
  <div id="banner" class="t-title"></div>
  <div id="modal"><div class="box"><h2 id="mtitle" class="t-title"></h2><p id="mtext"></p><div class="row" id="mbtns"></div></div></div>
  <div id="fade"></div>
</div></div>
<script src="js/game-core.js"></script>
<script src="js/gameplay.js"></script>
</body>
</html>
