<!doctype html>
<html lang="id"><head><script src="assets/js/frame-guard.js"></script><script src="assets/js/session.js"></script><script src="assets/js/boot-guard.js"></script><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dragon Roll — Pengaturan</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png"><link rel="icon" href="assets/icons/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/ng/css/common.css"><link rel="stylesheet" href="assets/ng/css/page.css"><link rel="stylesheet" href="assets/ng/css/settings.css"><link rel="stylesheet" href="assets/ng/css/bg.css">
<script src="assets/js/prefs.js"></script><script src="assets/js/prefs-sync.js"></script><script src="assets/js/ambience.js"></script>
</head>
<body class="sub">
<div id="wrap"><div id="stage">
  <button id="back" aria-label="Kembali"><img src="assets/ng/komponen/tombol-dan-kontrol/tombol-rumah-abu.webp" alt=""></button>
  <div id="title" class="ttl">PENGATURAN</div>

  <!-- kolom kiri: suara & getar -->
  <section id="rows">
    <div class="row"><img class="ic" id="ic-sfx" src="assets/ng/komponen/ikon-pengaturan/ikon-speaker.webp" alt=""><em>Efek suara</em>
      <input type="range" id="sfxVol" min="0" max="100" step="5" aria-label="Volume efek suara"><span class="val" id="sfxVolV"></span><button class="tg" data-tg="sound" aria-label="Efek suara"></button></div>
    <div class="row"><img class="ic" id="ic-music" src="assets/ng/komponen/ikon-pengaturan/ikon-musik-mati.webp" alt=""><em>Musik</em>
      <input type="range" id="musicVol" min="0" max="100" step="5" aria-label="Volume musik"><span class="val" id="musicVolV"></span><button class="tg" data-tg="music" aria-label="Musik"></button></div>
    <div class="row"><img class="ic" src="assets/ng/komponen/ikon-pengaturan/ikon-getar.webp" alt=""><em>Getar</em>
      <span class="sp"></span><button class="tg" data-tg="vibration" aria-label="Getar"></button></div>
  </section>

  <!-- kolom kanan: pilihan -->
  <section id="opts">
    <div class="grp"><div class="cap">GRAFIK</div><div class="seg" id="seg-gfx"><button data-gfx="high">Tinggi</button><button data-gfx="low">Rendah</button></div>
      <div id="gfxn" class="note">Pilih Rendah bila game terasa berat di HP kamu.</div></div>
    <div class="grp"><div class="cap">SUASANA</div><div class="seg" id="seg-amb"><button data-amb="day">Siang</button><button data-amb="night">Malam</button><button data-amb="system">Sistem</button></div>
      <div id="sysn"></div></div>
  </section>

  <div id="line"></div>
  <button class="btn" id="logout"><img src="assets/ng/komponen/tombol-dan-kontrol/tombol-abu-polos.webp" alt=""><span>KELUAR AKUN</span></button>

  <!-- konfirmasi keluar -->
  <div id="confirm" role="dialog" aria-modal="true" aria-labelledby="cf-t"><div id="cbox">
    <div id="cf-t" class="ttl">KELUAR AKUN?</div>
    <div id="cf-s">Koin, item, dan progres tetap tersimpan dan kembali saat kamu login lagi.</div>
    <div class="cbtns">
      <button class="btn" id="cf-no"><img src="assets/ng/komponen/tombol-dan-kontrol/tombol-abu-polos.webp" alt=""><span>BATAL</span></button>
      <button class="btn" id="cf-ok"><img src="assets/ng/komponen/tombol-dan-kontrol/tombol-merah-polos.webp" alt=""><span>KELUAR</span></button>
    </div>
  </div></div>
</div></div>
<div id="fade"></div>
<script src="assets/js/item-catalog.js"></script>
<script src="assets/js/player-data.js"></script>
<script src="assets/js/wallet-service.js"></script>
<script src="assets/js/app.js"></script>
<script src="hud/ui-core.js"></script>
<script>UT.App.init({page:'settings'});</script>
<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],PD=window.PlayerData,A=UT.Ambience;
const S=()=>PD.settings();
const buzz=()=>{try{if(S().vibration&&navigator.vibrate)navigator.vibrate(15)}catch(e){}};
const PF=()=>UT.Prefs;
const vol=(k,d)=>{const v=parseInt(PF().get(k,d),10);return isNaN(v)?d:Math.max(0,Math.min(100,v))};
function paintVol(){[['musicVol','musicVolV','musicVol',30],['sfxVol','sfxVolV','sfxVol',100]].forEach(([i,p,k,d])=>{const v=vol(k,d),el=$('#'+i);if(el&&document.activeElement!==el)el.value=v;$('#'+p).textContent=v+'%'})}
const shellSync=()=>{try{if(parent&&parent!==window&&parent.UTShell)parent.UTShell.syncMusic()}catch(e){}};
$('#musicVol').addEventListener('input',e=>{PF().set('musicVol',+e.target.value);$('#musicVolV').textContent=e.target.value+'%';shellSync()});
$('#sfxVol').addEventListener('input',e=>{PF().set('sfxVol',+e.target.value);$('#sfxVolV').textContent=e.target.value+'%'});
$('#sfxVol').addEventListener('change',()=>{try{UT.Audio.play('button')}catch(e){}});
const IC='assets/ng/komponen/';
function render(){
 paintVol();
 const T=S();
 $$('[data-tg]').forEach(b=>{const on=!!T[b.dataset.tg];b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
 $$('[data-gfx]').forEach(b=>{const on=T.graphics===b.dataset.gfx;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
 $$('[data-amb]').forEach(b=>{const on=T.ambience===b.dataset.amb;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
 $('#ic-sfx').src=IC+(T.sound?'ikon-pengaturan/ikon-speaker.webp':'glyph-putih/speaker-mati.webp');
 $('#ic-music').src=IC+(T.music?'glyph-putih/nada.webp':'ikon-pengaturan/ikon-musik-mati.webp');
 $('#sysn').innerHTML=T.ambience==='system'?'Mengikuti perangkat — sekarang: <b>'+(A.resolved()==='night'?'Malam':'Siang')+'</b>':T.ambience==='night'?'Malam: bintang, bulan &amp; cahaya bulan di lobby.':'Siang: matahari &amp; sinar emas di lobby.';
}
$$('[data-tg]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.tg;PD.setSettings({[k]:!S()[k]});buzz();render()}));
$$('[data-gfx]').forEach(b=>b.addEventListener('click',()=>{A.set({graphics:b.dataset.gfx});buzz();render()}));
$$('[data-amb]').forEach(b=>b.addEventListener('click',()=>{A.set({ambience:b.dataset.amb});buzz();render()}));
A.on(render);
/* kembali ke halaman asal (profil, toko, dll.); bila tidak ada, ke lobby */
const go=u=>{$('#fade').classList.add('on');setTimeout(()=>{location.href=u},330)};
const home=()=>{let to='lobby.html';try{const r=new URL(document.referrer);if(r.origin===location.origin){const n=r.pathname.split('/').pop();if(/^[a-z0-9_-]+\.html$/i.test(n)&&!/^(settings|splash|index|play)\.html$/i.test(n))to=n+r.search}}catch(e){}go(to)};
$('#back').addEventListener('click',()=>{buzz();home()});
/* keluar akun: wajib konfirmasi (logika sama dengan profil) */
const cf=$('#confirm'),openCf=()=>cf.classList.add('on'),closeCf=()=>cf.classList.remove('on');
$('#logout').onclick=openCf;$('#cf-no').onclick=closeCf;
cf.addEventListener('click',e=>{if(e.target===cf)closeCf()});
addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(cf.classList.contains('on'))closeCf();else home()});
$('#cf-ok').onclick=()=>{closeCf();import('./assets/js/auth.js').then(()=>UT.Auth.signOut()).catch(()=>{}).then(()=>{try{sessionStorage.removeItem('ut:booted')}catch(e){}UT.Session.clear();location.replace('splash.html')})};
/* skala kanvas 1920x1080 */
function fit(){$('#stage').style.transform='scale('+Math.min(innerWidth/1920,innerHeight/1080)+')'}
addEventListener('resize',fit);fit();
render();
document.documentElement.classList.add('ut-ready');
})();
</script>
</body></html>
