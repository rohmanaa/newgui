<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dragon Roll — Pengaturan</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/settings.css">
</head>
<body>
<div id="wrap"><div id="stage">
  <button id="back" class="round t-title">‹</button>
  <h1 class="t-title">PENGATURAN</h1>
  <div id="panel">
    <section><h3 class="t-title">Grafik</h3><div class="seg" data-k="graphics"><button data-v="high">Tinggi</button><button data-v="low">Rendah</button></div></section>
    <section><h3 class="t-title">Suara</h3>
      <label><em>Musik</em><input type="range" id="musicVol" min="0" max="100"><span id="musicVolV"></span><button class="tg" data-k="musicOn"></button></label>
      <label><em>Efek suara</em><input type="range" id="sfxVol" min="0" max="100"><span id="sfxVolV"></span><button class="tg" data-k="sfxOn"></button></label>
      <label><em>Getar</em><span></span><button class="tg" data-k="vibrate"></button></label></section>
    <section><h3 class="t-title">Suasana</h3><div class="seg" data-k="theme"><button data-v="day">Siang</button><button data-v="night">Malam</button><button data-v="system">Sistem</button></div></section>
    <button id="logout" class="gbtn red t-title">KELUAR AKUN</button>
  </div>
  <div id="toast"></div><div id="fade"></div>
</div></div>
<script src="js/settings.js"></script>
</body></html>
