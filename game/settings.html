<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/page.css">
<title>Dragon Roll — Pengaturan</title>
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/bg.css">
</head>
<body class="sub">
<div id="wrap"><div id="stage">
  <button id="back" aria-label="Kembali"><img src="assets/komponen/tombol-dan-kontrol/tombol-rumah-abu.webp" alt=""></button>
  <div id="title" class="ttl">PENGATURAN</div>

  <!-- kolom kiri: suara & getar (mengikuti orsWF1) -->
  <section id="rows">
    <div class="row"><img class="ic" id="ic-sfx" src="assets/komponen/ikon-pengaturan/ikon-speaker.webp" alt=""><em>Efek suara</em>
      <input type="range" id="sfxVol" min="0" max="100"><span class="val" id="sfxVolV"></span><button class="tg" data-k="sfxOn" aria-label="Efek suara"></button></div>
    <div class="row"><img class="ic" id="ic-music" src="assets/komponen/ikon-pengaturan/ikon-musik-mati.webp" alt=""><em>Musik</em>
      <input type="range" id="musicVol" min="0" max="100"><span class="val" id="musicVolV"></span><button class="tg" data-k="musicOn" aria-label="Musik"></button></div>
    <div class="row"><img class="ic" src="assets/komponen/ikon-pengaturan/ikon-getar.webp" alt=""><em>Getar</em>
      <span class="sp"></span><button class="tg" data-k="vibrate" aria-label="Getar"></button></div>
  </section>

  <!-- kolom kanan: pilihan -->
  <section id="opts">
    <div class="grp"><div class="cap">GRAFIK</div><div class="seg" data-k="graphics"><button data-v="high">Tinggi</button><button data-v="low">Rendah</button></div></div>
    <div class="grp"><div class="cap">SUASANA</div><div class="seg" data-k="theme"><button data-v="day">Siang</button><button data-v="night">Malam</button><button data-v="system">Sistem</button></div></div>
  </section>

  <div id="line"></div>
  <button class="btn" id="logout"><img src="assets/komponen/tombol-dan-kontrol/tombol-abu-polos.webp" alt=""><span>KELUAR AKUN</span></button>

  <!-- konfirmasi keluar -->
  <div id="confirm" role="dialog" aria-modal="true" aria-labelledby="cf-t"><div id="cbox">
    <div id="cf-t" class="ttl">KELUAR AKUN?</div>
    <div id="cf-s">Kamu perlu masuk lagi untuk bermain.</div>
    <div class="cbtns">
      <button class="btn" id="cf-no"><img src="assets/komponen/tombol-dan-kontrol/tombol-abu-polos.webp" alt=""><span>BATAL</span></button>
      <button class="btn" id="cf-ok"><img src="assets/komponen/tombol-dan-kontrol/tombol-merah-polos.webp" alt=""><span>KELUAR</span></button>
    </div>
  </div></div>
  <div id="toast"></div>
</div></div>
<div id="fade"></div>
<script src="js/settings.js"></script>
</body></html>
