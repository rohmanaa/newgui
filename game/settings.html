<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/page.css">
<title>Dragon Roll — Pengaturan</title>
<link rel="stylesheet" href="css/settings.css">
</head>
<body class="sub">
<div id="wrap"><div id="stage">
  <div id="sun"></div><div id="vig"></div>
  <button id="back" aria-label="Kembali"><img src="assets/komponen/tombol-dan-kontrol/tombol-rumah-abu.webp" alt=""><svg viewBox="0 0 24 24" fill="#fff"><path d="M15 4L7 12l8 8V4z"/></svg></button>
  <div id="title" class="ttl">PENGATURAN</div>
  <section class="panel" id="pg"><h3>GRAFIK</h3><div class="seg" data-k="graphics"><button data-v="high">Tinggi</button><button data-v="low">Rendah</button></div></section>
  <section class="panel" id="ps"><h3>SUARA</h3>
    <label><em>Musik</em><input type="range" id="musicVol" min="0" max="100"><span id="musicVolV"></span><button class="tg" data-k="musicOn"></button></label>
    <label><em>Efek suara</em><input type="range" id="sfxVol" min="0" max="100"><span id="sfxVolV"></span><button class="tg" data-k="sfxOn"></button></label>
    <label><em>Getar</em><span class="sp"></span><button class="tg" data-k="vibrate"></button></label></section>
  <section class="panel" id="pt"><h3>SUASANA</h3><div class="seg" data-k="theme"><button data-v="day">Siang</button><button data-v="night">Malam</button><button data-v="system">Sistem</button></div></section>
  <button class="btn" id="logout"><img src="assets/komponen/tombol-dan-kontrol/tombol-merah-polos.webp" alt=""><span>KELUAR AKUN</span></button>
  <div id="toast"></div><div id="fade"></div>
</div></div>
<script src="js/settings.js"></script>
</body></html>
